name: Deploy TaskFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: taskflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show the OIDC subject (debug)
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print("SUB =", json.loads(base64.urlsafe_b64decode(payload))["sub"])
          PY

      - name: Log in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::682849161360:role/taskflow-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} app
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Replace the servers with the new image
        run: |
          ASG=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?contains(AutoScalingGroupName,'taskflow')].AutoScalingGroupName | [0]" \
            --output text)
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}'
